[package]
name = "cripsy-binary-api-python"
version = "0.3.0"
edition = "2021"
rust-version = "1.86"
publish = false
description = "Bindings Python (PyO3) para cripsy-binary-api"
license = "MIT"
repository = "https://github.com/ionixcorp/cripsy_binary_API"
homepage = "https://ionixcorp.github.io/cripsy_binary_API/"

[lib]
name = "cripsy_binary_api"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
cripsy-binary-api = { path = ".." }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
