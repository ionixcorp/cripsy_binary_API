<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="cripsy_binary_API: cliente Rust para la API de IQ Option">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#141c2b"/>
    </linearGradient>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2434" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#fondo)"/>
  <rect width="1200" height="320" fill="url(#rejilla)" opacity="0.55"/>
  <rect x="0" y="0" width="6" height="320" fill="#6aa8ff"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#dde3ee">
    <circle cx="86" cy="104" r="7" fill="#6aa8ff"/>
    <text x="110" y="112" font-size="42" font-weight="600" letter-spacing="0.5">cripsy_binary_API</text>
    <text x="86" y="164" font-size="20" fill="#9aa5b8">Cliente Rust para la API de IQ Option: sesión, catálogo, velas,</text>
    <text x="86" y="194" font-size="20" fill="#9aa5b8">stream de ticks y órdenes clásicas, digitales y blitz</text>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#8d97a8">
    <rect x="86" y="228" width="150" height="30" rx="6" fill="#141c2b" stroke="#243044"/>
    <text x="103" y="248" fill="#6aa8ff">async</text>
    <rect x="248" y="228" width="112" height="30" rx="6" fill="#141c2b" stroke="#243044"/>
    <text x="265" y="248" fill="#6aa8ff">sync</text>
    <rect x="372" y="228" width="196" height="30" rx="6" fill="#141c2b" stroke="#243044"/>
    <text x="389" y="248" fill="#9aa5b8">multibroker</text>
    <text x="596" y="248" fill="#5c6678">MIT · Rust 1.86+</text>
  </g>
</svg>
